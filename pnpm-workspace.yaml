allowBuilds:
  '@parcel/watcher': true
  deasync: true
  esbuild: true
  sharp: true
  vercel: true

catalogs:
  build:
    'vite': npm:@voidzero-dev/vite-plus-core@latest
    'vite-tsconfig-paths': '^4.3.2'
    'vercel': '^52.0.0'
  dev:
    '@builder.io/qwik': '^1.19.2'
    '@builder.io/qwik-city': '^1.19.2'
    '@iconify-json/carbon': '^1.2.20'
    'unocss': '^66.6.8'
    'ignore': '^7.0.5'
  lint:
    'oxlint-plugin-qwik': '^0.0.9'
  types:
    '@types/node': '20.19.0'
    'typescript': '5.4.5'
    'typescript-plugin-css-modules': 'latest'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
